name: Validate and publish UI runtime

on:
  push:
    branches: ['**']
    paths:
      - 'McUtils/Jupyter/**'
      - 'McUtils/Readouts/**'
      - 'McUtils/Plots/Backends.py'
      - 'McUtils/Plots/X3DInterface.py'
      - 'ci/tests/JHTMLJavaScript*'
      - 'ci/tests/UIRuntimeReleaseTests.py'
      - 'ci/tests/AppsReadoutLayoutTests.py'
      - 'ci/publish_ui_runtime.py'
      - '.github/workflows/ui-runtime.yml'
      - 'MANIFEST.in'
  pull_request:
    paths:
      - 'McUtils/Jupyter/**'
      - 'McUtils/Readouts/**'
      - 'McUtils/Plots/Backends.py'
      - 'McUtils/Plots/X3DInterface.py'
      - 'ci/tests/JHTMLJavaScript*'
      - 'ci/tests/UIRuntimeReleaseTests.py'
      - 'ci/tests/AppsReadoutLayoutTests.py'
      - 'ci/publish_ui_runtime.py'
      - '.github/workflows/ui-runtime.yml'
      - 'MANIFEST.in'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mcutils-ui-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name != 'push' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      runtime_tag: ${{ steps.identity.outputs.tag }}
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      MCUTILS_TEST_EXTRAS: '1'
      NUMBA_DISABLE_JIT: '1'
      MPLBACKEND: Agg
      PYTHONPATH: '.'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install validation dependencies
        run: |
          python -m pip install numpy scipy numba matplotlib plotly ipywidgets markdown pyyaml playwright
          npm install --prefix "$RUNNER_TEMP/mcutils-ui" --no-save --package-lock=false jsdom@26.1.0 plotly.js-dist-min@3.4.0 bootstrap@5.1.3
      - name: Validate declarations, exports, and publication behavior
        run: |
          python -m unittest discover -s ci/tests -p JHTMLJavaScriptTests.py
          python -m unittest discover -s ci/tests -p UIRuntimeReleaseTests.py
          python ci/tests/AppsReadoutLayoutTests.py
      - name: Validate automatic WebComponents and offline assets
        run: |
          export NODE_PATH="$RUNNER_TEMP/mcutils-ui/node_modules"
          export MCUTILS_BOOTSTRAP_ASSETS="$NODE_PATH/bootstrap/dist"
          export MCUTILS_PLOTLY_JS="$NODE_PATH/plotly.js-dist-min/plotly.min.js"
          export MCUTILS_JS_FIXTURES="$RUNNER_TEMP/mcutils-ui-fixtures.json"
          python ci/tests/JHTMLJavaScriptTests.py --fixtures "$MCUTILS_JS_FIXTURES"
          node --check McUtils/Jupyter/JHTML/resources/javascript.js
          node --check McUtils/Jupyter/Apps/resources/native.js
          node --test ci/tests/JHTMLJavaScriptRuntimeTests.cjs
      - name: Validate in Chromium
        run: |
          python -m playwright install --with-deps chromium
          python -m unittest discover -s ci/tests -p JHTMLJavaScriptBrowserTests.py
      - name: Record the validated runtime identity
        id: identity
        run: python ci/publish_ui_runtime.py

  publish:
    needs: validate
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Publish or reuse the immutable runtime tag
        env:
          VALIDATED_RUNTIME_TAG: ${{ needs.validate.outputs.runtime_tag }}
        run: python ci/publish_ui_runtime.py --publish --expected-tag "$VALIDATED_RUNTIME_TAG"
