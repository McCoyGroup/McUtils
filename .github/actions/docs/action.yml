name: Build McUtils documentation
description: Generate documentation from the checked-out revision without publishing it
runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'
    - name: Install McUtils
      shell: bash
      run: python -m pip install .
    - name: Check documentation examples
      shell: bash
      run: python -m unittest discover -s ci/tests -p DocsExamplesTests.py -v
    - name: Generate documentation
      shell: bash
      run: python ci/build_docs.py
